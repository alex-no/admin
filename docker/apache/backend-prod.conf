# Два фронтенди на одному контейнері та одному бекенді.
#
# Хостовий Apache проксує обидва домени на 127.0.0.1:8082 з ProxyPreserveHost On,
# тож сюди приходить оригінальний Host — за ним і розводимо vhost'и.
#
# Спільний бекенд узятий свідомо: SQLite наповнюється процедурно згенерованою
# аналітикою при кожному старті контейнера, тож окремий контейнер для React показував
# би ІНШІ дані — і порівняти дві реалізації екран в екран стало б неможливо.

# ── Vue 3 (admin.4n.com.ua) ─────────────────────────────────────────────────
# Перший vhost — типовий: сюди ж потрапляє прямий доступ на 127.0.0.1:8082 без Host.
<VirtualHost *:80>
    ServerName admin.4n.com.ua
    ServerAlias www.admin.4n.com.ua

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # /api/* -> Yii3 front controller
            RewriteCond %{REQUEST_URI} ^/api/
            RewriteRule ^ index.php [L]

            # Реальні файли (зібраний фронтенд, favicon тощо) -> віддаємо напряму
            RewriteCond %{REQUEST_FILENAME} -f
            RewriteRule ^ - [L]

            # Все інше -> SPA (Vue Router history mode)
            RewriteRule ^ index.html [L]
        </IfModule>
    </Directory>
</VirtualHost>

# ── React (admin-react.4n.com.ua) ───────────────────────────────────────────
# Той самий DocumentRoot і той самий index.php для API — відрізняється лише
# точка входу SPA. Збірка React кладеться поруч із Vue-шною, але в інші імена:
#   public/react-index.html   (замість index.html)
#   public/react-assets/*     (замість app-assets/*, див. frontend-react/vite.config.ts)
<VirtualHost *:80>
    ServerName admin-react.4n.com.ua
    ServerAlias www.admin-react.4n.com.ua

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # /api/* -> той самий Yii3 front controller, що й у Vue-версії
            RewriteCond %{REQUEST_URI} ^/api/
            RewriteRule ^ index.php [L]

            # Реальні файли (react-assets/*, favicon тощо) -> віддаємо напряму
            RewriteCond %{REQUEST_FILENAME} -f
            RewriteRule ^ - [L]

            # Все інше -> SPA (React Router history mode)
            RewriteRule ^ react-index.html [L]
        </IfModule>
    </Directory>
</VirtualHost>
