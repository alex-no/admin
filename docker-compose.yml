services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: admin_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend
      - VITE_MOCK_AUTH=false
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
      # Конфіги сторінок list-framework, спільні з React (алиас @configs у vite.config).
      # Шлях у контейнері мусить бути саме /shared: vite резолвить '../shared/page-configs'
      # від __dirname == /app.
      - ./shared:/shared
    depends_on:
      - backend

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ../docker/frontend-react.Dockerfile
    container_name: admin_frontend_react
    working_dir: /app
    ports:
      - "5174:5174"
    environment:
      - VITE_API_PROXY_TARGET=http://backend
      - VITE_MOCK_AUTH=false
    volumes:
      - ./frontend-react:/app
      - node_modules_react:/app/node_modules
      # Той самий каталог, що у Vue-фронтенді — один конфіг сторінки на дві мови
      - ./shared:/shared
    depends_on:
      - backend

  backend:
    build:
      context: ./docker
      dockerfile: backend.Dockerfile
    container_name: admin_backend
    working_dir: /var/www/html
    ports:
      - "8080:80"
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    volumes:
      - ./backend:/var/www/html

volumes:
  node_modules:
  node_modules_react:
